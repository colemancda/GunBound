name: Swift
on: [push]
jobs:

  macos:
    name: macOS
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        config: ["debug", "release"]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    - name: Swift Version
      run: swift --version
    # The GunBoundSDL2/GunBoundSDL3 clients link Homebrew SDL (the
    # PureSwift/SDL shims include from /opt/homebrew), which the GitHub
    # runner doesn't ship.
    - name: Install SDL
      run: brew install sdl2 sdl2_mixer sdl3 sdl3_mixer
    - name: Build
      run: swift build -c ${{ matrix.config }}
    - name: Test
      run: swift test -c ${{ matrix.config }}

  coverage:
    name: Code Coverage
    runs-on: macos-latest
    permissions:
      contents: read
      code-quality: write # required by actions/upload-code-coverage
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    # Same Homebrew SDL set as the build/test job — `swift test` builds the
    # GunBoundSDL2/GunBoundSDL3 targets too.
    - name: Install SDL
      run: brew install sdl2 sdl2_mixer sdl3 sdl3_mixer
    - name: Export coverage and enforce threshold
      run: Scripts/coverage.sh
      env:
        # Baseline measured at 65.48% — start green, ratchet up as
        # coverage grows.
        COVERAGE_THRESHOLD: 65
    - name: Upload coverage to GitHub Code Quality
      uses: actions/upload-code-coverage@v1
      with:
        file: .build/coverage/coverage.xml
        language: Swift
        label: code-coverage/llvm-cov
        # Tolerate repos without Code Quality enabled so a failed upload
        # doesn't break CI.
        fail-on-error: false
    - name: Upload coverage artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage
        path: .build/coverage/
        if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        config: ["debug", "release"]
    container: swift:6.3.2-noble
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Swift Version
      run: swift --version
    # Only the Foundation-free GunBoundProtocol (packet parsing) library builds on
    # Linux for now; GunBound/GunBoundServer depend on the Socket package, whose
    # Linux target doesn't currently import Glibc for SOCK_* constants.
    - name: Build GunBoundProtocol
      run: swift build -c ${{ matrix.config }} --target GunBoundProtocol

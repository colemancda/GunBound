name: Swift
on: [push]
jobs:

  macos:
    name: macOS
    runs-on: macos-15
    strategy:
      matrix:
        config: ["debug", "release"]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Swift
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: "6.2.3"
    - name: Swift Version
      run: swift --version
    - name: Build
      run: swift build -c ${{ matrix.config }}
    - name: Test
      run: swift test -c ${{ matrix.config }}
  
  linux:
    name: Linux
    strategy:
      matrix:
        container: ["swift:6.2.3", "swiftlang/swift:nightly"]
        config: ["debug", "release"]
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}-jammy
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Swift Version
      run: swift --version
    - name: Build
      run: swift build -c ${{ matrix.config }}
    - name: Test
      run: swift test -c ${{ matrix.config }}

  android:
      name: Android
      strategy:
        fail-fast: false
        matrix:
          swift: ['6.2.3']
          arch: ["aarch64", "x86_64"]
      runs-on: macos-15
      timeout-minutes: 30
      steps:
        - uses: actions/checkout@v4
        - name: "Build Swift Package for Android"
          run: |
              brew install skiptools/skip/skip || (brew update && brew install skiptools/skip/skip)
              skip android sdk install --version ${{ matrix.swift }}
              skip android build --arch ${{ matrix.arch }}